name: CustomClans
version: '1.0.0'
main: de.customclans.clans.CustomClans
api-version: '1.20'
author: brigantdan246
depend: [Vault]
description: Eigenstaendiges Clan-Plugin mit Bank, Homes und Rollen.

commands:
  clan:
    description: Clan-Hauptbefehl
    usage: /clan <create|delete|bank|promote|demote|kick|home|info|transfer|chat>
  setclanhome:
    description: Setzt das Clan-Home an der aktuellen Position (ein Home pro Clan)
    usage: /setclanhome

permissions:
  customclans.use:
    description: Erlaubt die Nutzung aller Clan-Befehle
    default: true
